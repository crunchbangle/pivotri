name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: try2/package-lock.json

      - name: Install
        run: npm ci
        working-directory: try2

      - name: Test
        run: npm test
        working-directory: try2

      - name: Build
        run: npm run build
        working-directory: try2

      - name: Stage site
        run: |
          mkdir -p _site/dist _site/sim
          cp try2/index.html _site/
          cp try2/dist/main.js _site/dist/
          cp try2/dist/main.js.map _site/dist/ 2>/dev/null || true
          cp try2/sim/shortest-game.json _site/sim/ 2>/dev/null || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
