<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Game Prototype</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        canvas {
            border: 2px solid #333;
            background-color: white;
            display: block;
            margin: 0 auto;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Hex Game Prototype</h1>
    <div class="controls">
        <button id="resetBtn">Reset Grid</button>
        <span>Click on nodes to rotate triangles around them</span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script type="module" src="dist/main.js"></script>
</body>
</html>
